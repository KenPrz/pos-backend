services:
    api:
        build:
            context: .
            target: development
        ports:
            - "${API_PORT:-8000}:8000"
        environment:
            DB_HOST: mysql
            DB_PORT: ${DB_PORT:-3306}
            DB_USER: ${DB_USER:-pos}
            DB_PASSWORD: ${DB_PASSWORD:-pos}
            DB_NAME: ${DB_NAME:-pos}
        volumes:
            - .:/app
            - go-mod-cache:/go/pkg/mod
            - go-build-cache:/root/.cache/go-build
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        ports:
            - "${MYSQL_PORT:-3306}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${DB_NAME:-pos}
            MYSQL_USER: ${DB_USER:-pos}
            MYSQL_PASSWORD: ${DB_PASSWORD:-pos}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-p${MYSQL_ROOT_PASSWORD:-root}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

volumes:
    go-mod-cache:
    go-build-cache:
    mysql-data:
